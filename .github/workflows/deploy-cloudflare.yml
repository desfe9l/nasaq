name: Deploy to Cloudflare Pages

# Builds and deploys NASAQ to Cloudflare Pages with native Cloudflare Workers SSR
# and R2 object storage bindings.
#
# Production domains: nasaq.team, www.nasaq.team, nasaq.work, www.nasaq.work
# R2 Bucket: nasaq-sa

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify deployment configuration
        run: npm run check:deploy

      - name: Build application for Cloudflare Pages
        env:
          NITRO_PRESET: cloudflare-pages
          VITE_AUTH_ENABLED: "true"
          NASAQ_PRIMARY_DATABASE_URL: ${{ secrets.NASAQ_PRIMARY_DATABASE_URL || secrets.POSTGRES_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nasaq --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
