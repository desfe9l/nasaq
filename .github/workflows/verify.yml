name: Verify

# The gate that would have caught the two production outages this suite exists
# for:
#
#   · a module-load failure in the auth graph (the app must boot with NO
#     configured storage — that contract is pinned by
#     `src/lib/auth/deploy-runtime.test.ts`);
#   · the build itself (`check:deploy` + `vite build` + the deployment-time
#     migration runner, which must not fail the build when the database is
#     unreachable).
#
# Deliberately hermetic: no secrets, no database, no object storage. Every step
# below passes on a bare checkout, which is exactly the situation a new
# deployment starts from.
#
# `npm run check:auth` compares a RUNNING dev server against what the next build
# resolves, so it runs in the same step as the server it inspects (standalone it
# reports "could not observe", exit 2 — that is an observation gap, not a
# divergence).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck
      - name: Lint (errors fail, warnings are reported)
        run: npm run lint
      - name: Unit tests — auth contract (includes the boot contract)
        run: npm run test:auth
      - name: Unit tests — scripts (deploy/migration policy)
        run: npm run test:scripts
      - name: Unit tests — application, editor tools and product templates
        run: npm test
      - name: Environment audit (no undocumented variable, no VITE_ secret)
        run: npm run env:audit

      - name: Build (deploy check + Vercel output + migration runner)
        run: npm run build

      # Real HTTP against a real server, with the file-backed store — the same
      # flow a visitor performs: create an account, keep the session across a
      # reload, refuse a duplicate, refuse a wrong password, refuse a foreign
      # origin, sign in, reach a protected route, sign out.
      - name: Auth end-to-end (dev server + invariant)
        run: |
          setsid nohup npm run dev > /tmp/dev.log 2>&1 &
          ready=""
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/auth/ok > /dev/null; then ready=yes; break; fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::the dev server never answered /api/auth/ok"
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/api/auth/ok
          npm run check:auth
          npm run test:auth:e2e
      - name: Dev server log (on failure)
        if: failure()
        run: tail -100 /tmp/dev.log || true

  # The browser flows drive the real UI against a real dev server with the auth
  # endpoints MOCKED, so they cover the client half of sign-in (session boot,
  # sign-out, the NSQ account gate) without needing an identity store, a
  # provider or a secret. Separate job because a browser download is the one
  # part of this pipeline that can fail for reasons unrelated to the code.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start dev server
        run: |
          setsid nohup npm run dev > /tmp/dev-browser.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/auth/ok > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::the dev server never answered /api/auth/ok"
          tail -50 /tmp/dev-browser.log
          exit 1
      - name: Account gate + sign-out flows (auth endpoints mocked)
        run: |
          set -o pipefail
          status=0
          npm run test:nsq:browser 2>&1 | tee /tmp/nsq-browser.log || status=1
          npm run test:leave:browser 2>&1 | tee /tmp/leave-browser.log || status=1
          exit $status
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-logs
          path: |
            /tmp/nsq-browser.log
            /tmp/leave-browser.log
            /tmp/dev-browser.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Dev server log (on failure)
        if: failure()
        run: tail -100 /tmp/dev-browser.log || true
