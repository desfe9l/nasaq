name: Owner production migration + live verification

# Runs the owner's identity migration and every post-migration verification
# against the REAL production state, from a runner that holds the deployment's
# own configuration (the GitHub Environment's secrets — the same NASAQ_PRIMARY_DATABASE_URL
# and R2 credentials the Vercel deployment uses).
#
# Modes:
#   dry-run  — report what WOULD move; nothing is written. Run this first and
#              read the output. (The migration itself is guarded: only the
#              durable-binding canonical owner, only identity-store-proven
#              orphans, live accounts untouchable.)
#   migrate  — dry-run, then the guarded move, then the complete live
#              verification battery, including the reversible admin-mutation
#              probe (synthetic rows only, cleaned up in the same run).
#   verify   — skip the move; re-run the whole verification battery only.
#
# Every step prints statuses, counts and sha256 fingerprints — never a user
# id, address, licence key, key hash or secret. Secrets arrive as environment
# variables and are masked by Actions in any output.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment whose state is operated on
        required: true
        default: Production
        type: choice
        options: [Production]
      mode:
        description: dry-run (inspect), migrate (move + full verification), verify (verification only)
        required: true
        default: dry-run
        type: choice
        options: [dry-run, migrate, verify]
  push:
    branches: [main]
    paths:
      # An auditable, git-only trigger: the change to this file IS the request
      # (who/what/when is the commit), used where the token lacks actions:write
      # for workflow_dispatch. `mode=` inside selects the run.
      - "ops/owner-production.request"

permissions:
  contents: read
  issues: write

concurrency:
  group: owner-production-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  probe:
    name: "Environment probe: ${{ matrix.bound == 'true' && matrix.env || 'no binding' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: Production
            bound: 'true'
          - env: Preview
            bound: 'true'
          - env: copilot
            bound: 'true'
          - env: ''
            bound: 'false'
    environment: ${{ matrix.bound == 'true' && matrix.env || null }}
    concurrency:
      group: owner-production-probe-${{ matrix.bound }}-${{ matrix.env }}
      cancel-in-progress: false
    env:
      NASAQ_PRIMARY_DATABASE_URL: ${{ secrets.NASAQ_PRIMARY_DATABASE_URL || secrets.POSTGRES_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.STORAGE_ACCOUNT_ID || secrets.AWS_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.STORAGE_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.STORAGE_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
      KEYGEN_API_TOKEN: ${{ secrets.KEYGEN_API_TOKEN || secrets.KEYGEN_ACCOUNT_TOKEN || secrets.KEYGEN_TOKEN }}
    steps:
      - name: Presence sweep (NAMES only, never values)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
          echo "### probe — environment: ${{ matrix.bound == 'true' && matrix.env || '(none — repository secrets only)' }} — $(date -u +%FT%TZ)"
          have() { [ -n "${!1:-}" ]; }
          line() { if have "$1"; then echo "present : $2"; else echo "ABSENT  : $2"; fi; }
          line NASAQ_PRIMARY_DATABASE_URL "database url"
          s=0; for v in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do have "$v" && s=$((s+1)); done
          if [ "$s" -eq 3 ]; then echo "present : object storage trio"; else echo "ABSENT  : object storage trio ($s/3)"; fi
          line KEYGEN_API_TOKEN "keygen token"
          } > /tmp/probe-comment.md
          gh issue comment 162 --repo "$GITHUB_REPOSITORY" --body-file /tmp/probe-comment.md

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment || 'Production' }}
    env:
      NASAQ_PRIMARY_DATABASE_URL: ${{ secrets.NASAQ_PRIMARY_DATABASE_URL || secrets.POSTGRES_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.STORAGE_ACCOUNT_ID || secrets.AWS_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.STORAGE_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.STORAGE_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || secrets.STORAGE_BUCKET_NAME }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || secrets.STORAGE_ENDPOINT }}
      KEYGEN_API_TOKEN: ${{ secrets.KEYGEN_API_TOKEN || secrets.KEYGEN_ACCOUNT_TOKEN || secrets.KEYGEN_TOKEN }}
      KEYGEN_ACCOUNT_SLUG: ${{ secrets.KEYGEN_ACCOUNT_SLUG }}
      KEYGEN_PRODUCT_ID: ${{ secrets.KEYGEN_PRODUCT_ID }}
      NASAQ_OWNER_ID: ${{ secrets.NASAQ_OWNER_ID }}
      NASAQ_OWNER_EMAIL: ${{ secrets.NASAQ_OWNER_EMAIL }}
      NASAQ_SUPER_ADMIN_IDS: ${{ secrets.NASAQ_SUPER_ADMIN_IDS }}
      NASAQ_ADMIN_USER_IDS: ${{ secrets.NASAQ_ADMIN_USER_IDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund

      # The sandbox that audits this repository has no egress to GitHub's log
      # host, so every step's sanitized stdout (fingerprints/counts only —
      # never keys, raw ids, or secrets) is collected into one report and
      # published to the tracking issue at the end.
      - name: Initialize report
        shell: bash
        run: |
          echo "workflow started $(date -u +%FT%TZ)" > /tmp/owner-production-report.txt

      - name: Resolve operating mode (dispatch input, or the request file on push)
        id: op
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          else
            mode="$(sed -n 's/^mode[:=] *//p' ops/owner-production.request | tail -1 | tr -d '[:space:]')"
          fi
          case "$mode" in
            dry-run|migrate|verify) ;;
            *) echo "::error::unknown mode '$mode' (expected dry-run|migrate|verify)"; exit 2;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "operating mode: $mode"
          echo "mode=$mode" >> /tmp/owner-production-report.txt

      - name: Production environment sanity (presence of NAMES only, never values)
        shell: bash
        run: |
          {
          fail=0
          present_var() { local n="$1"; [ -n "$n" ] && [ -n "${!n:-}" ]; }
          first_present() { for n in "$@"; do if present_var "$n"; then echo "$n"; return 0; fi; done; return 1; }
          db="$(first_present NASAQ_PRIMARY_DATABASE_URL POSTGRES_URL || true)"
          if [ -n "$db" ]; then echo "present : database url (via $db)"; else echo "ABSENT  : database url (NASAQ_PRIMARY_DATABASE_URL family)"; fail=1; fi
          found=""
          for p in R2 STORAGE AWS; do
            if present_var "${p}_ACCOUNT_ID" && present_var "${p}_ACCESS_KEY_ID" && present_var "${p}_SECRET_ACCESS_KEY"; then found="$p"; break; fi
          done
          if [ -n "$found" ]; then echo "present : object storage trio (${found}_ family)"; else echo "ABSENT  : object storage trio (R2_/STORAGE_/AWS_ account+access+secret)"; fail=1; fi
          if present_var KEYGEN_API_TOKEN; then echo "present : KEYGEN_API_TOKEN"; else echo "ABSENT  : KEYGEN_API_TOKEN"; fail=1; fi
          if [ "$fail" -ne 0 ]; then echo "::error::a required capability is not configured for this run (see ABSENT lines; names only)"; exit 2; fi
          echo "sanity: all required capabilities present (verified by name only)"
          } 2>&1 | tee -a /tmp/owner-production-report.txt

      - name: Migration dry run (what would move, fingerprints only)
        if: steps.op.outputs.mode != 'verify'
        run: npm run migrate:owner -- --dry-run 2>&1 | tee -a /tmp/owner-production-report.txt

      - name: Owner identity migration (guarded, fingerprinted before/after)
        if: steps.op.outputs.mode == 'migrate'
        run: npm run migrate:owner 2>&1 | tee -a /tmp/owner-production-report.txt

      - name: Database verification (orphan rows = 0, structural integrity)
        run: |
          set -o pipefail
          npm run verify:owner -- --json 2>&1 | tee -a /tmp/owner-production-report.txt owner-verify-report.json

      - name: Keygen live verification (existing keys, status, activations, owner scope)
        run: npm run verify:provider 2>&1 | tee -a /tmp/owner-production-report.txt

      - name: Live identity chain (auth = owner = database = licence = admin = editor entitlement)
        run: npm run verify:owner-live 2>&1 | tee -a /tmp/owner-production-report.txt

      - name: Reversible admin-mutation probe (synthetic rows, cleaned up)
        if: steps.op.outputs.mode == 'migrate'
        run: npm run probe:admin-mutations 2>&1 | tee -a /tmp/owner-production-report.txt

      - name: Object storage round trip (upload → metadata → read → delete)
        run: npm run storage:verify 2>&1 | tee -a /tmp/owner-production-report.txt

      - name: Publish sanitized report to the tracking issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### owner-production run ${{ github.run_id }} — mode: ${{ steps.op.outputs.mode || 'unresolved' }} — $(date -u +%FT%TZ)"
            echo
            echo '```'
            tail -c 60000 /tmp/owner-production-report.txt 2>/dev/null || echo 'no report collected'
            echo
            echo '```'
          } > /tmp/owner-production-comment.md
          gh issue comment 162 --repo "$GITHUB_REPOSITORY" --body-file /tmp/owner-production-comment.md

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-verify-report-${{ steps.op.outputs.mode || 'unknown' }}
          path: owner-verify-report.json
          if-no-files-found: ignore
