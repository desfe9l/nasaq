name: Production render verification

# Renders the REAL deployment in a real browser and preserves screenshots +
# DOM facts as artifacts. Temporary verification scaffolding for this session's
# toolbar task; removed again before the branch lands on main.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public deployment URL to verify
        required: true
        default: https://nasaq-sa.vercel.app
        type: string
  push:
    branches: [arena/01a0ef2f-nasaq]
    paths: [.github/workflows/prod-render-verify.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Render production /editor
        run: |
          mkdir -p render-results
          node render-inspect.mjs 2>&1 | tee render-results/log.txt
        env:
          BASE_URL: ${{ inputs.base_url || 'https://nasaq-sa.vercel.app' }}
          DEPLOY_URL: https://nasaq-62hjhupkf-ararcomksa-2423s-projects.vercel.app
      - name: Publish render evidence on the branch
        if: always()
        run: |
          set -e
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -f render-results
          git commit -m "ci: live production render evidence [skip ci]" || echo "nothing to commit"
          git push origin HEAD:arena/01a0ef2f-nasaq
      - name: Preserve render evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: prod-render-evidence
          path: render-results/
          retention-days: 7
