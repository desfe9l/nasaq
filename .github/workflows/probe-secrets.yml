name: probe-secrets
# rerun: 1
on:
  push:
    branches: [arena/01a10b82-nasaq]
    paths: [.github/workflows/probe-secrets.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Secret presence (booleans only)
        env:
          HAS_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID != '' }}
          HAS_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          HAS_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}
          HAS_R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME != '' }}
          HAS_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT != '' }}
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_NASAQ_OWNER: ${{ secrets.NASAQ_OWNER_EMAIL != '' }}
        run: |
          echo "R2_ACCOUNT_ID=$HAS_R2_ACCOUNT_ID"
          echo "R2_ACCESS_KEY_ID=$HAS_R2_ACCESS_KEY_ID"
          echo "R2_SECRET_ACCESS_KEY=$HAS_R2_SECRET_ACCESS_KEY"
          echo "R2_BUCKET_NAME=$HAS_R2_BUCKET_NAME"
          echo "R2_ENDPOINT=$HAS_R2_ENDPOINT"
          echo "DATABASE_URL=$HAS_DATABASE_URL"
          echo "VERCEL_TOKEN=$HAS_VERCEL_TOKEN"
          echo "NASAQ_OWNER_EMAIL=$HAS_NASAQ_OWNER"
      - name: Production reachability
        run: |
          curl -s -o /dev/null -w "prod_status=%{http_code}\n" --max-time 20 https://nasaq-sa.vercel.app/
          curl -sI --max-time 20 https://nasaq-sa.vercel.app/ | grep -i "content-security-policy" | head -c 2000
