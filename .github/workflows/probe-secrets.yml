name: storage-production-verify

# TEMPORARY session scaffolding: the agent sandbox cannot reach Vercel or
# Cloudflare R2, so production verification runs from a GitHub runner.
on:
  push:
    branches: [arena/01a10b82-nasaq]
    paths: [.github/workflows/probe-secrets.yml, scripts/r2-production-verify.mjs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Storage + deployment verification
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node --experimental-strip-types scripts/r2-production-verify.mjs 2>&1 | tee ci-evidence/run.txt
      - name: Publish evidence on the branch
        if: always()
        continue-on-error: true
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -f ci-evidence
          git commit -m "ci: storage verification evidence" || echo "nothing to commit"
          git push origin HEAD:arena/01a10b82-nasaq || echo "push skipped"
